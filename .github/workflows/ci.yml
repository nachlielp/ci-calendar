name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Test
              run: npm test

            # Also checks the security headers and CSP (check:headers).
            - name: Build
              run: npm run build

            - name: Bundle size limit
              run: npm run check:bundle

            - name: Service worker precache
              run: npm run check:sw

            # The Cloudflare Worker and its config bundle (no credentials,
            # nothing deployed).
            - name: Worker dry run
              run: npm run cf:check
